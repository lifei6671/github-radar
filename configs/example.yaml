# 复制为 configs/radar.local.yaml，填好后以 -config 指定该文件。
# 相对路径以启动命令的工作目录为准。修改部署设置后重启服务。
server:
  # Go 服务实际绑定的地址。使用本机反向代理时可继续绑定 127.0.0.1。
  listen: "127.0.0.1:8080"
  # 浏览器访问本站的完整源地址，仅包含协议、域名或 IP，以及需要的端口。
  # 本地直连用下方 HTTP 地址。通过 HTTPS 反向代理对外时改为实际的 https://域名，
  # 即使 Go 服务本身监听 HTTP，后台也会签发仅通过 HTTPS 发送的会话 Cookie。
  site_url: "http://127.0.0.1:8080"

storage:
  # SQLite 数据库路径。指向已有数据库可继续使用其中的运行配置和数据。
  path: "./data/github-radar.db"

auth:
  # 后台和首次安装共用的管理员密码，单行至少 12 个字符，最多 512 字节。
  # 建议用 openssl rand -hex 24 生成。空值会阻止 HTTP 服务启动。
  admin_password: ""
  # 签发和校验后台 Cookie 的密钥，至少 32 字节。请独立运行 openssl rand -hex 32 生成。
  # 正常重启沿用同一密钥。修改密码或签名密钥并重启后，需要重新登录。
  session_secret: ""

# 采集、AI、分类、专题和备份等运行设置从后台保存到数据库。
# GitHub 和 AI 服务的访问密钥仍使用部署环境变量，避免进入数据库和备份。
