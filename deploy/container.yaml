# 容器部署示例。复制为 deploy/radar.local.yaml 并填写凭据后由 Compose 只读挂载。
server:
  # 容器内监听所有网卡。Compose 默认只把端口发布到宿主机回环地址。
  listen: "0.0.0.0:8080"
  # 浏览器访问的源地址。对外通过 HTTPS 反代时填写实际的 https://域名。
  site_url: "http://127.0.0.1:8080"

storage:
  # 使用 Compose 的持久卷，容器重建后仍保留数据库。
  path: "/app/data/github-radar.db"

auth:
  # 运行 go run ./cmd/radar hash-password，填入输出的 Argon2id 哈希。
  admin_password: ""
  # 运行 go run ./cmd/radar generate-session-secret，填入输出的 Cookie 签名密钥。
  # 修改任一凭据并重启服务后，管理员需要重新登录。
  session_secret: ""

credentials:
  # 两项均可留空，留空时读取对应环境变量。默认 GITHUB_TOKEN 和 AI_API_KEY。
  github_token: ""
  ai_api_key: ""
