disambiguation_rules:
  - id: "mcp-server-role"
    description: "仅实际实现 MCP 服务端协议才标 mcp-server；可选 MCP 集成和客户端不是服务端。"
  - id: "agent-vs-script"
    description: "智能体必须具备任务规划、模型决策和工具执行；普通脚本或单轮问答不是智能体。"
  - id: "browser-agent-vs-automation"
    description: "模型驱动决策用 browser-agent；确定性脚本浏览器操作用 browser-automation。"
  - id: "audio-role"
    description: "语音识别、语音合成、声音克隆分别按实际能力标注。"
  - id: "video-role"
    description: "视频生成、视频下载、视频剪辑功能不同，不因 README 同时提到就全部打标。"
  - id: "reverse-role"
    description: "逆向分析不等于普通代码搜索、静态检查或安卓应用开发。"
  - id: "mentioned-dependency"
    description: "仅被提及的框架、示例、赞助商、对比对象与依赖不自动成为项目能力。"
  - id: "traits-evidence"
    description: "出现 Docker 不等于自托管；本地可运行不等于本地优先，必须有核心用途证据。"
  - id: "stack-separated"
    description: "编程语言、框架和模型供应商是独立元数据，不属于技术用途标签。"
