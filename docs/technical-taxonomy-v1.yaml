# GitHub Radar 跨行业开源项目技术用途内置词表。分类使用技术能力轴。
version: "1.0.0"
status: "active"
tag_policy:
  max_primary_capabilities: 1
  primary_capability_required: false
  max_capabilities: 5
  max_domains: 2
  max_forms: 2
  max_industries: 2
  max_traits: 3
  confidence_auto_accept: 0.8
  confidence_review: 0.55
domains:
  - id: "ai-ml"
    name: "人工智能与机器学习"
    definition: "模型训练、推理、智能体及其应用"
  - id: "developer-tools"
    name: "开发工具与软件工程"
    definition: "编程、测试、调试、逆向、构建和研发效率"
  - id: "data-platforms"
    name: "数据与数据库"
    definition: "数据采集、存储、同步、检索和分析"
  - id: "cloud-native"
    name: "云原生与基础设施"
    definition: "容器、交付、监控、分布式系统及服务治理"
  - id: "security-privacy"
    name: "安全与隐私"
    definition: "漏洞、供应链、权限、取证和隐私工具"
  - id: "networking"
    name: "网络通信与代理"
    definition: "代理、隧道、路由和网络诊断"
  - id: "web-engineering"
    name: "网站与前后端开发"
    definition: "网站框架、网页组件、接口与内容管理"
  - id: "desktop-mobile"
    name: "桌面移动与系统工具"
    definition: "终端、桌面应用、移动开发和系统管理"
  - id: "automation-integration"
    name: "自动化与系统集成"
    definition: "工作流、浏览器、桌面和跨服务集成"
  - id: "media-creation"
    name: "音视频、图像与内容工具"
    definition: "媒体获取、处理、编辑、生产和分发"
  - id: "knowledge-productivity"
    name: "知识与效率"
    definition: "笔记、知识库、文档转换和日常工作"
  - id: "robotics-iot"
    name: "机器人与物联网"
    definition: "机器人、传感器和联网设备控制"
  - id: "games-xr"
    name: "游戏与扩展现实"
    definition: "游戏工具、互动三维和虚拟现实"
  - id: "scientific-tools"
    name: "科研与专业工程"
    definition: "科学仿真、数学、生命科学和地理分析"
  - id: "blockchain-web3"
    name: "区块链与分布式账本"
    definition: "链上协议、合约、钱包和链上分析"
  - id: "hardware-systems"
    name: "硬件芯片与底层系统"
    definition: "芯片、加速器、固件和设备驱动"
capabilities:
  - id: "ai-agent"
    name: "通用智能体"
    domain: "ai-ml"
    aliases: ["ai agent", "autonomous agent"]
    definition: "可自主拆解任务并执行多步操作"
  - id: "multi-agent"
    name: "多智能体协作"
    domain: "ai-ml"
    aliases: ["multi-agent", "agent orchestration"]
    definition: "多个智能体分工协作或互审"
  - id: "coding-agent"
    name: "编程智能体"
    domain: "ai-ml"
    aliases: ["coding agent", "software engineering agent"]
    definition: "自主阅读修改代码并运行测试"
  - id: "browser-agent"
    name: "浏览器智能体"
    domain: "ai-ml"
    aliases: ["browser agent", "web agent"]
    definition: "通过模型决策网页操作的智能体"
  - id: "agent-skill"
    name: "智能体技能"
    domain: "ai-ml"
    aliases: ["agent skill", "agent skills"]
    definition: "为智能体组织的可复用技能和任务说明"
  - id: "agent-memory"
    name: "智能体记忆"
    domain: "ai-ml"
    aliases: ["agent memory", "long-term memory"]
    definition: "跨会话存储和检索智能体记忆"
  - id: "agent-evaluation"
    name: "智能体评测"
    domain: "ai-ml"
    aliases: ["agent evaluation", "agent benchmark"]
    definition: "测量智能体执行任务的表现"
  - id: "mcp-server"
    name: "MCP 服务端"
    domain: "ai-ml"
    aliases: ["mcp server", "model context protocol server"]
    definition: "实现协议服务端并对外提供工具或资源"
  - id: "mcp-client"
    name: "MCP 客户端"
    domain: "ai-ml"
    aliases: ["mcp client"]
    definition: "连接、发现和调用 MCP 服务端"
  - id: "tool-calling"
    name: "模型工具调用"
    domain: "ai-ml"
    aliases: ["function calling", "tool use"]
    definition: "模型函数调用的声明和执行管理"
  - id: "rag"
    name: "检索增强生成"
    domain: "ai-ml"
    aliases: ["retrieval augmented generation"]
    definition: "以外部检索补充模型生成所需上下文"
  - id: "llm-inference"
    name: "大模型推理"
    domain: "ai-ml"
    aliases: ["llm inference", "inference runtime"]
    definition: "大模型推理引擎与性能优化"
  - id: "model-serving"
    name: "模型服务部署"
    domain: "ai-ml"
    aliases: ["model serving", "inference server"]
    definition: "以服务形式提供模型在线推理"
  - id: "model-routing"
    name: "模型路由网关"
    domain: "ai-ml"
    aliases: ["llm gateway", "model router"]
    definition: "多模型供应商路由、切换和治理"
  - id: "model-training"
    name: "模型预训练"
    domain: "ai-ml"
    aliases: ["pretraining", "model training"]
    definition: "基础模型训练和训练集群管理"
  - id: "fine-tuning"
    name: "模型微调"
    domain: "ai-ml"
    aliases: ["lora", "peft", "sft"]
    definition: "参数高效与监督微调"
  - id: "reinforcement-learning"
    name: "强化学习训练"
    domain: "ai-ml"
    aliases: ["rl", "rlhf", "grpo"]
    definition: "模型或智能体的强化学习训练"
  - id: "model-evaluation"
    name: "模型评测"
    domain: "ai-ml"
    aliases: ["llm eval", "model benchmark"]
    definition: "模型质量与能力基准评估"
  - id: "prompt-tooling"
